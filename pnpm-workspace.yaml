# Standalone workspace for the injishi product repo.
#
# `packages/*` holds the five shared packages, and globbing them here is what
# lets apps keep `workspace:*`.
#
# It was called `vendor/` and was a build-output mirror of `injishi.managed`.
# That repository is deleted, these are the only copies, and ADR-034 renamed the
# directory to say so: a directory called `vendor` is a directory nobody edits,
# which is the wrong instruction to leave on the only copy of a design system.
#
# `server/*` is globbed because the api lives in this repo. Dropping any of
# the three breaks the standalone build: apps stop resolving `workspace:*`.
packages:
  - apps/*
  - server/*
  - packages/*

# Run every allowed build script on every install, never reuse a cached result.
# `@heroui-pro/react`'s postinstall downloads Pro's real code only when
# HEROUI_AUTH_TOKEN (or a developer's login) is present, and pnpm's side effects
# cache is keyed on the package, not on that variable: one install without the
# token cached the empty stub, and every later install, token or not, reused it
# without running the script. CI restores the store from the Actions cache and
# the web and admin images keep one in a cache mount, so both fell into it
# (PR #22's first run with the secret set built nothing). The cost is esbuild's
# and sharp's install checks, and Pro's download, on every install.
sideEffectsCache: false
