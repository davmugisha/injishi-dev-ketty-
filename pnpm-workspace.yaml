# The one pnpm workspace for the injishi product repo.
#
# `apps/*` holds the new interface (apps/app on Next.js, apps/mobile on Expo)
# and the marketplace (apps/web). `server/*` holds the API. `packages/*` holds
# the shared packages, and globbing them here is what lets every member keep
# `workspace:*`. Dropping any of the three breaks the build.
#
# `products/*` holds the eleven products (ADR-074 D-c): screens, flows and
# product metadata, each `@injishi/product-<id>`, with no authority, no secrets
# and no database. It is globbed before the first product exists, so the
# manifest check, the lint ratchet and CI's change detection see a product the
# day its folder lands. `injishi/product-boundaries` keeps its edges.
packages:
  - apps/*
  - products/*
  - server/*
  - packages/*

# Packages too new for pnpm's default minimum release age.
minimumReleaseAgeExclude:
  - react-resizable-panels@4.14.5
  - zod@4.6.7
  - '@gravity-ui/icons@2.22.1'
# Slow/flaky networks: be patient with large tarballs (next, swc, turbo).
fetchRetries: 6
fetchTimeout: 300000
networkConcurrency: 8

# The same store folder names on every machine. pnpm shortens long names to 60 characters on Windows
# and 120 elsewhere, and the Expo app's runtime version (its fingerprint, mobile spec 0001 AC-9) hashes
# those paths, so without this a build made on EAS's Linux machines refuses updates published from
# Windows. 60 is Windows' own default, so nothing changes there.
virtualStoreDirMaxLength: 60

# Only these packages may run install scripts.
# @heroui-pro/react downloads its licensed components in postinstall,
# authenticated with HEROUI_AUTH_TOKEN (see .env.example). msgpackr-extract
# (bullmq) and sharp are the API's native builds.
allowBuilds:
  '@heroui-pro/react': true
  '@parcel/watcher': false
  '@swc/core': false
  '@zowe/secrets-for-zowe-sdk': false
  esbuild: true
  heroui-native-pro: true
  heroui-pro: true
  msgpackr-extract: true
  sharp: true
# Run every allowed build script on every install, never reuse a cached result.
# pnpm's side effects cache is keyed on the package, not on HEROUI_AUTH_TOKEN:
# one install without the token caches @heroui-pro/react's empty stub, and every
# later install, token or not, reuses it without running the postinstall.
sideEffectsCache: false

# One set of React type definitions for the whole workspace. The Expo app runs React 19.3.0 (React Native's
# renderer pins the exact version) while the web apps run 19.3.1; their runtimes stay separate, but two
# @types/react copies make HeroUI's declarations and the web code disagree, so every member type-checks
# against 19.3.0.
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
