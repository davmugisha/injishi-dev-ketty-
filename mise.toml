# Tool versions for the builders and for anyone running mise.
#
# The root package.json says `>=22.13`, which is a floor and not a choice —
# under it a builder is free to move to a new major between two deploys of the
# same commit. Pin it here instead.
#
# pnpm matches `packageManager` in the root package.json. The two must agree:
# a different pnpm can rewrite pnpm-lock.yaml, and `--frozen-lockfile` then
# fails the build on a lockfile nobody edited.
[tools]
node = "22.23.2"
pnpm = "12.3.4"
