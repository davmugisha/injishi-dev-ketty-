# Staging's client rules (DOKPLOY.md, Developer access to staging). The server
# reads this file through `-c hba_file=`, so the copy initdb wrote into the data
# volume is ignored.
#
# Inside the container, and from the stack's own compose networks, exactly as
# the image's defaults allowed. From anywhere else, which is a laptop coming in
# through the published port, ONLY the developer role and ONLY over TLS. The
# owner role (POSTGRES_USER, a superuser) never answers outside the stack.
#
# A published port keeps the caller's own address (Docker DNATs it), which is
# what lets the private ranges below stand for "this host's containers".
#
# TYPE   DATABASE  USER         ADDRESS          METHOD
local    all       all                           trust
host     all       all          127.0.0.1/32     trust
host     all       all          ::1/128          trust
host     all       all          10.0.0.0/8       scram-sha-256
host     all       all          172.16.0.0/12    scram-sha-256
host     all       all          192.168.0.0/16   scram-sha-256
hostssl  all       injishi_dev  0.0.0.0/0        scram-sha-256
hostssl  all       injishi_dev  ::/0             scram-sha-256
