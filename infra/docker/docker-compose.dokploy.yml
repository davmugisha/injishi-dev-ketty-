# Production, on the Hangaa VPS: Dokploy organisation Hangaa Softwares, project
# Injishi, environment Production, one compose service.
#
# DOKPLOY.md owns every deploy fact; this file is the contract it describes.
# DOKPLOY DEPLOYS IT. Dokploy clones the repository, writes the environment's
# variables to infra/docker/.env (the project directory, so compose reads them
# without --env-file), and runs `docker compose -p <appName> -f
# infra/docker/docker-compose.dokploy.yml up -d --build`. The build context is
# the repo root (`context: ../..` from this file). Every image is built on the
# host, the API's included: GHCR pulls depended on image.yml, which cannot run
# while GitHub Actions refuses hosted jobs.
#
# PRODUCTION ONLY (ADR-043). The demo used to live in this file: the same api
# container answered on the demo host too, and doubled a database, a worker and
# three frontends beside production. It is its own stack now
# (docker-compose.demo.yml, project injishi-demo), so nothing here depends on a
# demo service, and a failed demo migration, build or boot cannot touch this
# stack.
#
# WHICH PLATFORM THIS IS is pinned below as literals, never read from the env
# file: the API runs as `production` and refuses to boot unless its database
# carries no sample marker (`INJISHI_DATABASE_KIND: real`). A mistyped line in
# the Dokploy environment therefore cannot turn production into a sample stack.
#
# ROUTING IS SPLIT, and never doubled. The three plain hosts are Dokploy domain
# rows on this compose service, so they are managed in Dokploy's Domains tab:
# www → web:3000, api → api:8000, app → app:3002. The routers a domain row
# cannot express stay here as Traefik labels: the apex's permanent redirect to
# www and the storage host's reads only rule. Never add a label router for a
# host that has a domain row, or the reverse: two routers for one host is a
# coin toss. The `web` and `websecure` entrypoints, the `letsencrypt` resolver
# and `redirect-to-https@file` come from Dokploy's Traefik. Label router names
# start with `injishi-production-` so they cannot collide with staging's.
#
# STORAGE AND MAIL. Objects live in the minio service, encrypted at rest, in
# the bucket minio-init provisions before the API or the worker may start.
# Browsers read them only through URLs the API signs for the public storage
# host. Mail leaves through the SMTP relay SMTP_URL names; there is no default,
# so compose refuses to start without one rather than boot an API that cannot
# send a code.
#
# Secrets are ${VAR} substitutions, never committed values. They live in the
# Production environment's variables in Dokploy (names in dokploy.env.example).
# The ones with no safe fallback use the `:?` form, so compose refuses to start
# without them. infra/docker/docker-compose.yml stays local.

x-api-env: &api-env
  # Pinned here, never from the env file (ADR-043, AC-6). The API reads both at
  # boot and refuses to start when the database disagrees.
  INJISHI_ENVIRONMENT: production
  INJISHI_DATABASE_KIND: real
  # Payments OFF: no provider is chosen and there are no credentials, so every
  # charge is refused with "nothing has been charged". Pinned, not from the env
  # file. Unset meant mock, which on this real database recorded imaginary money
  # as captured; the API now refuses to boot on `real` with mock or unset
  # (booking audit, 2026-09-13). `live` only once a live adapter is registered.
  PAYMENT_ADAPTER_MODE: "off"
  # The support assistant (ADR-061). Off unless the host env file turns it on. `live` needs ANTHROPIC_API_KEY from the host env file, never from this file, and the API refuses to boot on `live` without it.
  ASSISTANT_ADAPTER_MODE: ${ASSISTANT_ADAPTER_MODE:-off}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Spending limits and prices (ADR-061 D-s, D-t), from the host env file. A
  # blank value means the API's default: no monthly ceiling (the boot log says
  # so on live), 30 model answers a day, and Sonnet 5.5's published prices.
  ASSISTANT_MONTHLY_BUDGET_USD: ${ASSISTANT_MONTHLY_BUDGET_USD:-}
  ASSISTANT_AI_TURNS_PER_DAY: ${ASSISTANT_AI_TURNS_PER_DAY:-}
  ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-}
  ASSISTANT_PRICE_INPUT_PER_MTOK_USD: ${ASSISTANT_PRICE_INPUT_PER_MTOK_USD:-}
  ASSISTANT_PRICE_OUTPUT_PER_MTOK_USD: ${ASSISTANT_PRICE_OUTPUT_PER_MTOK_USD:-}
  ASSISTANT_PRICE_CACHE_READ_PER_MTOK_USD: ${ASSISTANT_PRICE_CACHE_READ_PER_MTOK_USD:-}
  ASSISTANT_PRICE_CACHE_WRITE_PER_MTOK_USD: ${ASSISTANT_PRICE_CACHE_WRITE_PER_MTOK_USD:-}
  # Money alarms (STUCK MONEY, UNRECORDED COMPENSATION, a refused queue wake)
  # and what breaks (a request that fails with a 500, a fault inside Better
  # Auth, a job failing its last attempt, a process that dies) go to Sentry
  # when this is set, and nowhere but the log when it is not (ADR-063). Left
  # empty until the NCSA registration names Sentry (ADR-063 AC-13).
  SENTRY_DSN: ${SENTRY_DSN:-}
  NODE_ENV: production
  PORT: "8000"
  # One trusted hop: Dokploy's Traefik, the only thing that routes to api
  # (port 8000 is `expose`d, never published). Traefik appends the address it
  # saw to X-Forwarded-For, and that entry becomes request.ip; anything a caller
  # wrote to the left of it is ignored. Pinned, not from the env file. Put a
  # proxying CDN in front (DOKPLOY.md, Admin network gate) and this becomes 2.
  TRUST_PROXY: "1"
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  COOKIE_SECRET: ${COOKIE_SECRET}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # Mixed into every kiosk PIN hash (ADR-058, 058-time AC-TM11), so a leaked
  # PIN table alone cannot be brute forced. Production refuses to boot without
  # a strong one, and compose refuses first. Changing it invalidates every PIN.
  HR_PIN_PEPPER: "${HR_PIN_PEPPER:?set HR_PIN_PEPPER to a kiosk PIN pepper via openssl rand -base64 32}"
  BETTER_AUTH_URL: https://${API_HOST:-api.injishi.com}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.injishi.com}
  # Every browser origin that calls this API. The apex only redirects, but it is
  # listed so a request that beats the redirect is not refused. The app's own
  # origin is here because its server side calls name it as their Origin
  # (INJISHI_API_ORIGIN below), and Better Auth refuses a sign-in from an origin
  # it does not trust. No staging origin: staging calls its own API.
  CORS_ORIGINS: https://${WEB_HOST:-www.injishi.com},https://${APEX_HOST:-injishi.com},https://${APP_HOST:-app.injishi.com},https://${ADMIN_HOST:-admin.injishi.com}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Object storage: the live S3 adapter on the minio service. The API writes
  # over the compose network and signs browser URLs for the public storage host.
  # Its credential is the scoped user minio-init creates, never MinIO's root.
  STORAGE_ADAPTER_MODE: live
  # `injishi-minio`, not `minio`: api also joins dokploy-network, where the
  # other stacks' `minio` answers to the same name, and Docker may resolve it
  # there. The alias exists only on this project's own network.
  STORAGE_S3_ENDPOINT: http://injishi-minio:9000
  STORAGE_S3_PUBLIC_ENDPOINT: https://${STORAGE_HOST:-storage.injishi.com}
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY, the API's own MinIO user}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY, the API's own MinIO secret}
  # minio-init reads this same name, so the API verifies what was provisioned.
  STORAGE_BUCKET: ${STORAGE_BUCKET:-injishi}
  STORAGE_REQUIRE_ENCRYPTION: "true"
  # Mail: the SMTP relay, e.g. smtps://resend:<key>@smtp.resend.com:465. No
  # default: production refuses to boot without a transport, and compose
  # refuses first.
  SMTP_URL: ${SMTP_URL:?set SMTP_URL to the production SMTP relay}
  MAIL_FROM: "${MAIL_FROM:-Injishi <no-reply@injishi.com>}"
  # Web's public origin, for a mail that links to a page on web (the owner claim
  # invitation, ADR-053). The same host NEXT_PUBLIC_WEB_URL is built from below,
  # so a mail and a page agree. Production refuses to boot without it.
  WEB_URL: https://${WEB_HOST:-www.injishi.com}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# The public origins each frontend build compiles in. Used as build args (they
# are inlined at compile time) and again as runtime env.
x-production-public: &production-public
  NEXT_PUBLIC_API_URL: https://${API_HOST:-api.injishi.com}
  NEXT_PUBLIC_WEB_URL: https://${WEB_HOST:-www.injishi.com}
  NEXT_PUBLIC_SITE_URL: https://${WEB_HOST:-www.injishi.com}
  # The operator app answers on its own host now (the interface PR #38 brought
  # has its routes at the root, so web's `/w` zone no longer reaches it), and
  # web's sign-in may send a visitor back there.
  NEXT_PUBLIC_PMS_URL: https://${APP_HOST:-app.injishi.com}
  NEXT_PUBLIC_ADMIN_URL: https://${ADMIN_HOST:-admin.injishi.com}
  # Pinned (ADR-043, AC-14). A production build never strips session cookies:
  # only a `demo` build does, and it would strip production's own session.
  NEXT_PUBLIC_INJISHI_ENVIRONMENT: production

networks:
  default:
  dokploy-network:
    external: true

volumes:
  db-data:
  redis-data:
  minio-data:
  app-data:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injishi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-injishi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  # In-country S3-compatible object storage (Law 058/2021). Every object is
  # encrypted at rest with the KMS key below, and the bucket is private: a
  # browser reads an object only through a URL the API signed.
  #
  # Public on STORAGE_HOST for exactly that. Traefik routes the S3 port and only
  # reads (GET, HEAD, and the OPTIONS a browser may preflight) outside MinIO's
  # own /minio/ paths; writes come from the API over the compose network. The
  # console is switched off, so there is no port 9001 to route by mistake.
  # Administer with `docker compose -p injishi exec minio mc`.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-injishi}
      # Root answers on the public storage host, so there is no default.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD, root answers on the public storage host}
      # <key-name>:<base64 of 32 random bytes>. It encrypts every object: lose it
      # or change it and everything stored is unreadable. Back it up off the host.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY, see dokploy.env.example}
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    healthcheck:
      # The image carries mc but no curl; `local` is its alias for this server.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.injishi-production-storage.loadbalancer.server.port=9000
      - traefik.http.routers.injishi-production-storage-http.rule=Host(`${STORAGE_HOST:-storage.injishi.com}`)
      - traefik.http.routers.injishi-production-storage-http.entrypoints=web
      - traefik.http.routers.injishi-production-storage-http.middlewares=redirect-to-https@file
      - traefik.http.routers.injishi-production-storage-http.service=injishi-production-storage
      - traefik.http.routers.injishi-production-storage.rule=Host(`${STORAGE_HOST:-storage.injishi.com}`) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`)) && !PathPrefix(`/minio/`)
      - traefik.http.routers.injishi-production-storage.entrypoints=websecure
      - traefik.http.routers.injishi-production-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.injishi-production-storage.service=injishi-production-storage
    networks:
      default:
        # The name the API and minio-init use. See STORAGE_S3_ENDPOINT above.
        aliases:
          - injishi-minio
      dokploy-network: {}

  # One shot, on every `up`: makes the bucket private and encrypted and creates
  # the API's own MinIO user, limited to what the storage adapter needs
  # (minio/provision.sh, idempotent). The API and the worker start only once it
  # has exited 0, so neither boots against a bucket that is not there.
  minio-init:
    # minio's own SERVER image, not quay.io/minio/mc. It ships /usr/bin/mc at
    # the release the mc image was pinned to (RELEASE.2025-08-13T08-35-41Z),
    # plus the sh and timeout provision.sh needs. quay.io has answered 401 for
    # MinIO's images since at least 2026-09-25, so an mc tag a host had not
    # cached could no longer be pulled: the demo's nightly `up` failed on it
    # five nights running and left the API stopped. One image for both
    # services also means the one a host holds serves both.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      MINIO_ENDPOINT: http://injishi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-injishi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The same name the API is given, so it verifies what was provisioned.
      STORAGE_BUCKET: ${STORAGE_BUCKET:-injishi}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_ENCRYPT: "on"
    volumes:
      - ./minio/provision.sh:/provision.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default

  api:
    # Built on this host by Dokploy's `up --build`, like the frontends. ADR-052
    # AC-9 pulled one GHCR image per green commit instead, so staging and
    # production ran the same binary; image.yml cannot run while GitHub Actions
    # refuses hosted jobs, and a pull of a tag that was never built stopped
    # every release. Staging builds the same Dockerfile from the same commit.
    # INJISHI_COMMIT is empty unless the Dokploy environment sets it, so
    # `/api/v1/platform` reports the commit only when someone stamps it.
    image: injishi-api:production
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        INJISHI_COMMIT: ${INJISHI_COMMIT:-}
    restart: unless-stopped
    # Image WORKDIR is /app. Repo-root spelling of the same step:
    # node server/api/scripts/migrate.mjs
    # Then the platform reference data (geography, RDB classes, amenities, government bodies, the VAT row):
    # idempotent, never a user or a sample row, so it is safe on every start (seed-reference.mjs).
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed-reference.mjs && node dist/main.js"]
    environment:
      <<: *api-env
      INJISHI_PROCESS: http
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # The public host api.injishi.com is a Dokploy domain row (port 8000). This
    # label only tells Traefik which of the two networks reaches the container.
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      default:
        # The name web's and app's server side calls use (INTERNAL_API_URL,
        # INJISHI_API_URL). Not `api`: web and app also join dokploy-network,
        # where another stack's `api` answers to it.
        aliases:
          - injishi-api
      dokploy-network: {}

  # Same image as api. INJISHI_PROCESS=worker boots the queue process, on the
  # same database and Redis, under the same pinned platform.
  worker:
    # The same image as api, from the same build: one API image, two processes,
    # so a queue can never run code the HTTP process did not ship.
    image: injishi-api:production
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        INJISHI_COMMIT: ${INJISHI_COMMIT:-}
    restart: unless-stopped
    environment:
      <<: *api-env
      INJISHI_PROCESS: worker
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks:
      - default

  # The public origin. www.injishi.com is a Dokploy domain row (port 3000); the
  # apex lands here too and Traefik redirects it to www.
  web:
    image: injishi-web:production
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      secrets:
        - heroui_token
      args:
        <<: *production-public
        OPERATOR_APP_URL: http://app:3002
    restart: unless-stopped
    environment:
      <<: *production-public
      NODE_ENV: production
      PORT: "3000"
      OPERATOR_APP_URL: http://app:3002
      # Server only, read at runtime. Sign-in sends reach the API over the compose
      # network so the visitor's IP can be forwarded (apps/web/src/lib/otp.server.ts).
      INTERNAL_API_URL: http://injishi-api:8000
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # The apex answers with a permanent redirect to www, path kept. No domain
      # row can say that, so both of its routers live here and serve nothing
      # themselves (noop@internal): plain http goes to https first, then https
      # goes to www.
      - traefik.http.routers.injishi-production-apex-http.rule=Host(`${APEX_HOST:-injishi.com}`)
      - traefik.http.routers.injishi-production-apex-http.entrypoints=web
      - traefik.http.routers.injishi-production-apex-http.middlewares=redirect-to-https@file
      - traefik.http.routers.injishi-production-apex-http.service=noop@internal
      - traefik.http.routers.injishi-production-apex.rule=Host(`${APEX_HOST:-injishi.com}`)
      - traefik.http.routers.injishi-production-apex.entrypoints=websecure
      - traefik.http.routers.injishi-production-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.injishi-production-apex.middlewares=injishi-production-apex-to-web
      - traefik.http.routers.injishi-production-apex.service=noop@internal
      - traefik.http.middlewares.injishi-production-apex-to-web.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.injishi-production-apex-to-web.redirectregex.replacement=https://${WEB_HOST:-www.injishi.com}/$${1}
      - traefik.http.middlewares.injishi-production-apex-to-web.redirectregex.permanent=true
    networks:
      - default
      - dokploy-network

  # The operator app on its own host, app.injishi.com, a Dokploy domain row
  # (port 3002). It holds the API's session in its own `ij_session` cookie on
  # that origin and calls the API server side only, over this project's
  # network. Its embedded fixture database (@injishi/db, libSQL) lives on the
  # app-data volume so a restart does not reseed it.
  app:
    image: injishi-app:production
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
      secrets:
        - heroui_token
      args:
        <<: *production-public
        OPERATOR_ASSET_PREFIX: /operator-static
    restart: unless-stopped
    environment:
      <<: *production-public
      NODE_ENV: production
      PORT: "3002"
      OPERATOR_ASSET_PREFIX: /operator-static
      INJISHI_API_URL: http://injishi-api:8000
      # The Origin its calls carry, listed in the API's CORS_ORIGINS.
      INJISHI_API_ORIGIN: https://${APP_HOST:-app.injishi.com}
      INJISHI_DB_URL: file:/data/injishi.db
    volumes:
      - app-data:/data
    expose:
      - "3002"
    # The image's own check fetches `/`, which redirects to web's public origin,
    # so it would measure web and the internet rather than this process.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/sign-in',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      - default
      - dokploy-network

# HeroUI Pro's CI/CD token for the frontend builds, read from the Dokploy
# environment's variables (stack settings live on the host, never in GitHub).
# See the note in Dockerfile.web.
secrets:
  heroui_token:
    environment: HEROUI_AUTH_TOKEN
