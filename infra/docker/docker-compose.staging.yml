# Staging, on the Hangaa VPS beside production: Dokploy organisation Hangaa
# Softwares, project Injishi, environment Staging, one compose service.
#
# DOKPLOY.md owns every deploy fact; this file is the contract it describes.
# DOKPLOY DEPLOYS IT, exactly as it deploys production: it clones the
# repository, writes the environment's variables to infra/docker/.env and runs
# `docker compose -p <appName> -f infra/docker/docker-compose.staging.yml up -d
# --build` with the repo root as the build context. Every image is built on the
# host from the same Dockerfiles production builds.
#
# THE API AND THE OPERATOR APP, NOTHING ELSE. Staging ships api, worker and app
# with their own Postgres, Redis, MinIO and Mailpit, its own secrets and its own
# volumes (the project name namespaces them). It ships no web and no admin.
#
# A PRODUCTION PROCESS ON A SAMPLE DATABASE (ADR-043), pinned below as literals:
# it issues random codes like production, and its database carries the sample
# marker and the same sample recipe the demo and a laptop run
# (`seed-sample.mjs`), demo roster included. The API refuses to boot on an
# unmarked database, so the FIRST bring up migrates, marks and seeds in a one
# time container (DOKPLOY.md names the command).
#
# UNDER injishi.com, BY THE OWNER'S CHOICE (2026-10-20): api-staging. and
# app-staging.injishi.com. Production sets its session cookie on
# `.injishi.com`, so a browser signed in to production hands that cookie to
# these hosts too. Staging cannot verify it (its secret is its own) and its
# logs redact cookies, but unreleased code does receive it. Staging's own API
# cookie is host only (AUTH_COOKIE_DOMAIN is empty), so it never reaches
# production.
#
# PUBLIC WHERE IT HAS TO BE. The API and the app are Dokploy domain rows and
# answer anyone; a stranger still cannot sign in, because every code goes to
# this stack's Mailpit. The storage host and the Mailpit inbox answer only to
# STAGING_ALLOWED_IPS (loopback when unset). Every service carries a resource
# ceiling so a test run cannot starve production on the same host.
#
# Label router names start with `injishi-staging-` so they cannot collide with
# production's. Images are tagged `:staging` for the same reason.

x-api-env: &api-env
  # Pinned here, never from the env file (ADR-043, AC-6): a production process
  # that refuses to boot unless its database carries the sample marker.
  INJISHI_ENVIRONMENT: production
  INJISHI_DATABASE_KIND: sample
  NODE_ENV: production
  PORT: "8000"
  # One trusted hop, as production: Dokploy's Traefik is the only route to api
  # (8000 is `expose`d, never published), and the address it appends to
  # X-Forwarded-For becomes request.ip. The frontends' server side calls reach
  # the API through its public address, so they arrive through Traefik too.
  TRUST_PROXY: "1"
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  COOKIE_SECRET: ${COOKIE_SECRET}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # The kiosk PIN pepper (058-time AC-TM11). Staging runs the production
  # platform, so it refuses to boot without one. Never production's.
  HR_PIN_PEPPER: "${HR_PIN_PEPPER:?set HR_PIN_PEPPER to a kiosk PIN pepper via openssl rand -base64 32}"
  # Seals landlords' bank account numbers (rentals payout accounts). Staging
  # runs the production platform, so it refuses to boot without one.
  PAYOUT_ACCOUNT_ENCRYPTION_KEY: "${PAYOUT_ACCOUNT_ENCRYPTION_KEY:?set PAYOUT_ACCOUNT_ENCRYPTION_KEY via openssl rand -base64 32}"
  BETTER_AUTH_URL: https://${API_HOST:-api-staging.injishi.com}
  # Empty: a host only cookie on the API's host. A cookie on `.injishi.com`
  # would reach production. The app keeps its session in its own cookie.
  AUTH_COOKIE_DOMAIN: ""
  # The app's origin, which its server side calls send as their Origin.
  CORS_ORIGINS: https://${APP_HOST:-app-staging.injishi.com}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # The support assistant (ADR-061). Off unless the host env file turns it on. `live` needs ANTHROPIC_API_KEY from the host env file, never from this file, and the API refuses to boot on `live` without it.
  ASSISTANT_ADAPTER_MODE: ${ASSISTANT_ADAPTER_MODE:-off}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Spending limits and prices (ADR-061 D-s, D-t), from the host env file. A
  # blank value means the API's default: no monthly ceiling (the boot log says
  # so on live), 30 model answers a day, and Sonnet 5.5's published prices.
  ASSISTANT_MONTHLY_BUDGET_USD: ${ASSISTANT_MONTHLY_BUDGET_USD:-}
  ASSISTANT_AI_TURNS_PER_DAY: ${ASSISTANT_AI_TURNS_PER_DAY:-}
  ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-}
  ASSISTANT_PRICE_INPUT_PER_MTOK_USD: ${ASSISTANT_PRICE_INPUT_PER_MTOK_USD:-}
  ASSISTANT_PRICE_OUTPUT_PER_MTOK_USD: ${ASSISTANT_PRICE_OUTPUT_PER_MTOK_USD:-}
  ASSISTANT_PRICE_CACHE_READ_PER_MTOK_USD: ${ASSISTANT_PRICE_CACHE_READ_PER_MTOK_USD:-}
  ASSISTANT_PRICE_CACHE_WRITE_PER_MTOK_USD: ${ASSISTANT_PRICE_CACHE_WRITE_PER_MTOK_USD:-}
  # Object storage on this stack's minio, through the scoped user minio-init
  # creates. `injishi-minio`, not `minio`: api also joins dokploy-network, where
  # production's `minio` answers to the same name.
  STORAGE_ADAPTER_MODE: live
  STORAGE_S3_ENDPOINT: http://injishi-minio:9000
  STORAGE_S3_PUBLIC_ENDPOINT: https://${STORAGE_HOST:-storage-staging.injishi.com}
  STORAGE_S3_REGION: us-east-1
  STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY, the API's own MinIO user}
  STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY, the API's own MinIO secret}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-injishi}
  STORAGE_REQUIRE_ENCRYPTION: "true"
  # Every message is caught by this stack's Mailpit (by its own-network alias,
  # for the same reason as the storage endpoint). Nothing here can mail a
  # real person, so there is no relay credential to leak or to spend.
  SMTP_URL: smtp://injishi-mailpit:1025
  MAIL_FROM: "Injishi Staging <no-reply@staging.injishi.com>"
  # Web's public origin, for a mail that links to a page on web (ADR-053). The
  # API refuses to boot without one. Staging has no web, so its mail names the
  # app's origin, and a link to a page only web has answers 404 there.
  WEB_URL: https://${APP_HOST:-app-staging.injishi.com}
  LOG_LEVEL: ${LOG_LEVEL:-debug}

x-staging-public: &staging-public
  NEXT_PUBLIC_API_URL: https://${API_HOST:-api-staging.injishi.com}
  # The app sends `/` to web's front door. Staging has no web, so its front
  # door is the app's own sign-in screen.
  NEXT_PUBLIC_WEB_URL: https://${APP_HOST:-app-staging.injishi.com}/sign-in
  NEXT_PUBLIC_PMS_URL: https://${APP_HOST:-app-staging.injishi.com}
  # Pinned (ADR-043, AC-14). Staging's builds are production builds: they never
  # strip session cookies, which only the demo's builds do.
  NEXT_PUBLIC_INJISHI_ENVIRONMENT: production

x-small: &small
  resources:
    limits:
      cpus: "0.25"
      memory: 256M

x-medium: &medium
  resources:
    limits:
      cpus: "0.50"
      memory: 512M

x-large: &large
  resources:
    limits:
      cpus: "1.00"
      memory: 768M

networks:
  default:
  dokploy-network:
    external: true

volumes:
  db-data:
  redis-data:
  minio-data:
  app-data:

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-injishi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-injishi}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy: *medium
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: *small
    networks:
      - default

  # Production's MinIO, pinned the same and encrypted the same, with its own
  # KMS key and credentials. Its S3 port answers on storage-staging.injishi.com
  # behind the staging allowlist (testers' browsers fetch the signed URLs), for
  # reads only and never MinIO's own /minio/ paths. The console is off, so
  # there is no port 9001 to route.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-injishi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD, root answers on the storage host}
      # <key-name>:<base64 of 32 random bytes>, never production's. Lose it or
      # change it and every object stored here is unreadable.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY, see dokploy-staging.env.example}
      MINIO_BROWSER: "off"
    expose:
      - "9000"
    volumes:
      - minio-data:/data
    healthcheck:
      # The image carries mc but no curl; `local` is its alias for this server.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Medium, not small: it now serves every upload and every signed read.
    deploy: *medium
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.injishi-staging-storage.loadbalancer.server.port=9000
      - traefik.http.middlewares.injishi-staging-storage-allow.ipallowlist.sourcerange=${STAGING_ALLOWED_IPS:-127.0.0.1/32}
      - traefik.http.routers.injishi-staging-storage-http.rule=Host(`${STORAGE_HOST:-storage-staging.injishi.com}`)
      - traefik.http.routers.injishi-staging-storage-http.entrypoints=web
      - traefik.http.routers.injishi-staging-storage-http.middlewares=redirect-to-https@file
      - traefik.http.routers.injishi-staging-storage-http.service=injishi-staging-storage
      - traefik.http.routers.injishi-staging-storage.rule=Host(`${STORAGE_HOST:-storage-staging.injishi.com}`) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`)) && !PathPrefix(`/minio/`)
      - traefik.http.routers.injishi-staging-storage.entrypoints=websecure
      - traefik.http.routers.injishi-staging-storage.tls.certresolver=letsencrypt
      - traefik.http.routers.injishi-staging-storage.middlewares=injishi-staging-storage-allow
      - traefik.http.routers.injishi-staging-storage.service=injishi-staging-storage
    networks:
      default:
        # The name the API and minio-init use. See STORAGE_S3_ENDPOINT above.
        aliases:
          - injishi-minio
      dokploy-network: {}

  # One shot, on every `up`: the bucket private and encrypted, and the API's
  # own scoped user (minio/provision.sh). The API and worker start only once it
  # has exited 0.
  minio-init:
    # minio's own SERVER image, not quay.io/minio/mc. It ships /usr/bin/mc at
    # the release the mc image was pinned to (RELEASE.2025-08-13T08-35-41Z),
    # plus the sh and timeout provision.sh needs. quay.io has answered 401 for
    # MinIO's images since at least 2026-09-25, so an mc tag a host had not
    # cached could no longer be pulled: the demo's nightly `up` failed on it
    # five nights running and left the API stopped. One image for both
    # services also means the one a host holds serves both.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      MINIO_ENDPOINT: http://injishi-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-injishi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-injishi}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_ENCRYPT: "on"
    volumes:
      - ./minio/provision.sh:/provision.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    deploy: *small
    networks:
      - default

  # Every message staging sends lands here and goes no further. The inbox (web
  # UI and API, port 8025) answers on mail-staging.injishi.com behind the staging
  # allowlist, which is how a tester reads a sign-in code. SMTP (1025) is never
  # routed. Never set OTP_DEBUG_LOG here: this inbox is the way to read a code.
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    environment:
      # The same setting the local compose carries. Mailpit looks up the client's
      # reverse DNS before its 220 greeting; where that lookup stalls past the
      # API's 5s greeting timeout every demo sign-in code fails with a 500,
      # because NODE_ENV=production turns the log fallback off (demo-comms).
      MP_SMTP_DISABLE_RDNS: "true"
    expose:
      - "1025"
      - "8025"
    deploy: *small
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.injishi-staging-mail.loadbalancer.server.port=8025
      - traefik.http.middlewares.injishi-staging-mail-allow.ipallowlist.sourcerange=${STAGING_ALLOWED_IPS:-127.0.0.1/32}
      - traefik.http.routers.injishi-staging-mail-http.rule=Host(`${MAIL_HOST:-mail-staging.injishi.com}`)
      - traefik.http.routers.injishi-staging-mail-http.entrypoints=web
      - traefik.http.routers.injishi-staging-mail-http.middlewares=redirect-to-https@file
      - traefik.http.routers.injishi-staging-mail-http.service=injishi-staging-mail
      - traefik.http.routers.injishi-staging-mail.rule=Host(`${MAIL_HOST:-mail-staging.injishi.com}`)
      - traefik.http.routers.injishi-staging-mail.entrypoints=websecure
      - traefik.http.routers.injishi-staging-mail.tls.certresolver=letsencrypt
      - traefik.http.routers.injishi-staging-mail.middlewares=injishi-staging-mail-allow
      - traefik.http.routers.injishi-staging-mail.service=injishi-staging-mail
    networks:
      default:
        # The name SMTP_URL uses. See SMTP_URL above.
        aliases:
          - injishi-mailpit
      dokploy-network: {}

  api:
    # Built on this host by Dokploy's `up --build`, from the same Dockerfile
    # production builds (docker-compose.dokploy.yml says why it is not pulled).
    image: injishi-api:staging
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        INJISHI_COMMIT: ${INJISHI_COMMIT:-}
    restart: unless-stopped
    # Image WORKDIR is /app. Repo-root spelling: node server/api/scripts/migrate.mjs
    # Then the platform reference data (geography, RDB classes, amenities, government bodies, the VAT row):
    # idempotent, never a user or a sample row, so it is safe on every start (seed-reference.mjs).
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/seed-reference.mjs && node dist/main.js"]
    environment:
      <<: *api-env
      INJISHI_PROCESS: http
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8000)+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    deploy: *large
    # api-staging.injishi.com is a Dokploy domain row (port 8000). This label
    # only tells Traefik which of the two networks reaches the container.
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      default:
        # The name the app's server side calls use (INJISHI_API_URL). Not
        # `api`: app also joins dokploy-network, where production's `api`
        # answers to it.
        aliases:
          - injishi-api
      dokploy-network: {}

  worker:
    # The same image as api, from the same build: one API image, two processes,
    # so a queue can never run code the HTTP process did not ship.
    image: injishi-api:staging
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        INJISHI_COMMIT: ${INJISHI_COMMIT:-}
    restart: unless-stopped
    environment:
      <<: *api-env
      INJISHI_PROCESS: worker
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    deploy: *medium
    networks:
      - default

  # The operator app on app-staging.injishi.com, a Dokploy domain row (port
  # 3002), as production's app is on app.injishi.com. Staging ships no web.
  app:
    image: injishi-app:staging
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.app
      secrets:
        - heroui_token
      args:
        <<: *staging-public
        OPERATOR_ASSET_PREFIX: /operator-static
    restart: unless-stopped
    environment:
      <<: *staging-public
      NODE_ENV: production
      PORT: "3002"
      OPERATOR_ASSET_PREFIX: /operator-static
      INJISHI_API_URL: http://injishi-api:8000
      # The Origin its calls carry, listed in the API's CORS_ORIGINS.
      INJISHI_API_ORIGIN: https://${APP_HOST:-app-staging.injishi.com}
      INJISHI_DB_URL: file:/data/injishi.db
    volumes:
      - app-data:/data
    expose:
      - "3002"
    # The image's own check fetches `/`, which redirects to a public origin,
    # so it would measure Traefik and the internet rather than this process.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/sign-in',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    deploy: *large
    labels:
      - traefik.docker.network=dokploy-network
    networks:
      - default
      - dokploy-network

# HeroUI Pro's CI/CD token for the app build, read from the Dokploy
# environment's variables (stack settings live on the host, never in GitHub). See the
# note in Dockerfile.web.
secrets:
  heroui_token:
    environment: HEROUI_AUTH_TOKEN
