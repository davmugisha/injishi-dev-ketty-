# Sign in with a demo account and the demo code, then switch through every seat
# the account holds, saving a screenshot of each surface (ADR-062 AC-2, AC-3).
#
# Run it with `pnpm --filter @injishi/mobile e2e`, which sets the device theme
# and passes THEME. It needs the local demo API: the demo accounts list is only
# served there, so this flow cannot run against production.
appId: rw.injishi.mobile
name: Sign in with the demo code and switch seat
env:
  THEME: ${THEME || 'light'}
---
# The run script set the system theme, and the app follows the system after a
# clean start. Checking it here means a theme switch that silently failed fails
# the run instead of producing two runs of the same theme.
- runFlow:
    when:
      true: ${THEME == 'dark'}
    commands:
      - assertDarkMode
- runFlow:
    when:
      true: ${THEME != 'dark'}
    commands:
      - assertLightMode

- runFlow: ../subflows/open-dev-build.yaml
# The demo accounts list arrives from the API after the screen draws.
- extendedWaitUntil:
    visible: "Demo accounts"
    timeout: 30000
- takeScreenshot: ${THEME}-0-sign-in

# Samuel Kayitare holds four seats the switcher lists (Personal, Kayitare Court,
# Kivu Crest Hotel, Broker), which makes him the account that can switch.
- scrollUntilVisible:
    element: "Samuel Kayitare"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "Samuel Kayitare"
- scrollUntilVisible:
    element: "Continue"
    direction: UP
    timeout: 10000
- tapOn: "Continue"

# On the demo, the code screen fills the published code (123456) and submits it
# by itself (ADR-038 AC-S10). An emailed sign in code also counts as the step
# up, so no second code screen follows (`packages/auth/src/server.ts`).
#
# A new session starts on the first seat the server lists, which for Samuel is
# Broker. Wait for its Directory tab, not just for a tab bar: until the seats
# arrive the app draws a stand in surface (Tenant, on 2026-10-01).
- extendedWaitUntil:
    visible: "Directory"
    timeout: 60000
# Let the units load so the screenshot shows the list, not its placeholders.
# Optional: this flow proves the sign in, not the directory's data.
- extendedWaitUntil:
    visible: "[0-9]+ units?"
    timeout: 30000
    optional: true
- takeScreenshot: ${THEME}-1-broker

# Each surface's first tab is absent from the tab bar before it, so seeing it
# proves the switch landed. The order keeps that true; change it with care.
- runFlow:
    file: ../subflows/switch-seat.yaml
    env:
      SEAT: "Kayitare Court, owner"
      HOME: "Rent roll"
      SHOT: 2-landlord
- runFlow:
    file: ../subflows/switch-seat.yaml
    env:
      SEAT: "Kivu Crest Hotel, housekeeper"
      HOME: "Queue"
      SHOT: 3-work
- runFlow:
    file: ../subflows/switch-seat.yaml
    env:
      SEAT: "As Guest"
      HOME: "Explore"
      SHOT: 4-guest
- runFlow:
    file: ../subflows/switch-seat.yaml
    env:
      SEAT: "As Tenant"
      HOME: "Leases"
      SHOT: 5-tenant
