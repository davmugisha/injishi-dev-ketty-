name: mobile-release

# ADR-052 AC-21. An EAS build starts on a `mobile-v*` tag and on nothing else.
#
# EAS build minutes are metered and a build is slow, so this belongs on a
# deliberate release rather than on every merge. Tagging is the deliberate act.
#
# Mobile is outside `pnpm build` and has no `build` script: it is an Expo
# export, not a `next build`. What standing behind a mobile change means on a
# pull request is the checks in `ci.yml`'s `mobile` job (typecheck, lint and
# test), and this workflow is what turns a tagged commit into an artifact.
#
# NOT SET UP YET: apps/mobile has no eas.json (no build profiles, no project
# id). Until one is committed, a tag runs the checks and then stops with a
# notice instead of failing inside `eas build`. Adding eas.json (with a
# `production` profile) and the EXPO_TOKEN secret is what turns the build on.

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup

      # Mobile consumes the tokens, the vocabulary contract and
      # @injishi/contracts. The tokens and contracts are compiled (consumers read
      # dist/), so both are built before anything reads them.
      - name: Build the compiled packages
        run: pnpm --filter @injishi/contracts --filter @injishi/design-tokens build

      # Fail here rather than 20 minutes into an EAS build. These are the same
      # checks ci.yml runs; a tag can point at any commit, including one that
      # never went through a pull request.
      - name: Check before spending build minutes
        run: |
          set -euo pipefail
          pnpm --filter @injishi/mobile typecheck
          pnpm --filter @injishi/mobile lint
          pnpm --filter @injishi/mobile test

      - name: Is EAS set up
        id: eas
        run: |
          if [ -f apps/mobile/eas.json ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice file=apps/mobile::No apps/mobile/eas.json yet, so no EAS build starts. The checks above passed."
          fi

      - uses: expo/expo-github-action@v8
        if: steps.eas.outputs.configured == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start the build
        if: steps.eas.outputs.configured == 'true'
        working-directory: apps/mobile
        # The `production` profile in eas.json. Derived from the tag rather than
        # taken as an input: `mobile-v*` means a release, and a release builds
        # the release profile.
        run: eas build --non-interactive --no-wait --platform all --profile production
