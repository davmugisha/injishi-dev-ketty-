name: image

# ADR-048 AC-9. Build the API image ONCE per green commit on `main` and push it
# to GHCR tagged with that commit's short sha.
#
# Only the API. The three frontend Dockerfiles bake `NEXT_PUBLIC_*` and
# `OPERATOR_APP_URL` at image build time, so a frontend image belongs to exactly
# one stack and cannot be promoted from one to another. They are built on the
# host, from each stack's own compose file (AC-10).
#
# This is what turns "staging ran this commit" into a statement about a binary
# rather than about a rebuild that happened to start from the same source.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: build and push the API image
    # Only a green `ci` run, and only one that was itself a push to `main`.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # `workflow_run` runs against the DEFAULT BRANCH's ref, not against the
      # commit that triggered it. A workflow that trusts the default checkout
      # builds the wrong thing the moment two commits land close together, so
      # the triggering sha is resolved and checked out explicitly.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$HEAD_SHA" ]; then
            echo "::error::Checked out $checked_out but the triggering commit was $HEAD_SHA."
            exit 1
          fi
          short="$(git rev-parse --short HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Building $short"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token. Scoped `packages: write` above, so there
          # is no extra credential to create, store or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          # INJISHI_COMMIT is the ONE build argument this Dockerfile takes, and
          # it must equal the tag: `docker inspect` on the image is how you
          # answer "which commit is production running" without trusting a
          # deployment record.
          build-args: |
            INJISHI_COMMIT=${{ steps.tag.outputs.short }}
          tags: ghcr.io/${{ github.repository_owner }}/injishi-api:${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
