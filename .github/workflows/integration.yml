name: integration

# ADR-052 AC-7, AC-7b, AC-8. The checks that need a real database.
#
# `progress-tracker.md` names the runtime gap as the one thing that would make
# the booking flow believable. This workflow is what closes it on every pull
# request instead of owing it: the migrations really run, the seeds really
# write, and the three `verify:*` scripts really answer.
#
# Two of those three are HTTP clients, so this job builds and STARTS the API and
# waits for it to listen. That makes the job slower and gives it more ways to
# fail, and it is also the only way those scripts prove anything.

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/api/**'
      - 'packages/contracts/**'
      - 'packages/auth/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]

permissions:
  contents: read
  packages: read # pulling the captured production schema

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# HeroUI Pro's CI/CD token (a paid licence): `@heroui-pro/react`'s postinstall
# downloads Pro's real code with it, and without it the first Pro import fails
# `next build`. Never a personal token. A pull request from a fork gets no
# secrets, so its build of a Pro screen fails; this repository takes none.
env:
  HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

jobs:
  database:
    name: against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # The same majors the compose files pin, so a migration proved here is
      # proved against the version that will run it.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: injishi
          POSTGRES_PASSWORD: injishi
          POSTGRES_DB: injishi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U injishi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://injishi:injishi@127.0.0.1:5432/injishi
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

      # AC-7b. `verify:ops-reads` and `verify:walk-in` sign in over HTTP with
      # the fixed OTP code, which exists ONLY in a demo process. Pinned
      # explicitly rather than inherited from the unset default, so a change to
      # that default cannot silently break this job.
      INJISHI_ENVIRONMENT: demo

      # NODE_ENV is deliberately NOT set to `production`: that refuses to boot
      # without SMTP_URL and forces the real OTP path, which has no code this
      # job could read.

      COOKIE_SECRET: ci-only-cookie-secret-not-a-real-one
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-a-real-one
      BETTER_AUTH_URL: http://127.0.0.1:8000
      CORS_ORIGINS: http://127.0.0.1:3000
      LOG_LEVEL: warn

      # No MinIO service container: ADR-052 names Postgres and Redis only, and
      # `local` writes to disk, which is all these scripts need.
      STORAGE_ADAPTER_MODE: local

      # The scripts default to this; set anyway so a port change is one edit.
      VERIFY_API_URL: http://127.0.0.1:8000
      PORT: '8000'

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup

      - name: Build the compiled packages
        run: pnpm --filter @injishi/contracts --filter @injishi/design-tokens build

      # ── AC-7, in this order, each exiting 0 or the run fails ───────────────
      - name: Apply every migration
        run: pnpm --filter @injishi/api db:migrate

      - name: Mark the database sample
        # Postgres accepts this marker only on a database with no users, so it
        # cannot be written over anything real. Every seed refuses a database
        # that does not carry it, and there is no flag to override that.
        working-directory: server/api
        run: node scripts/mark-sample-database.mjs --sample

      - name: Seed
        run: pnpm --filter @injishi/api db:seed

      - name: verify:authz
        # The one verify script that needs no running API: it reads
        # DATABASE_URL and nothing else.
        run: pnpm --filter @injishi/api verify:authz

      # ── AC-7b, the two HTTP clients ───────────────────────────────────────
      - name: Build the API
        run: pnpm --filter @injishi/api build

      - name: Start the API and wait for it to answer
        working-directory: server/api
        run: |
          set -euo pipefail
          node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"

          # The verify scripts do NOT wait. Nothing else supplies this, and
          # without it they fail against an API that is merely not listening
          # yet, which reads as a product failure and is not one.
          for attempt in $(seq 1 60); do
            if curl -fsS "$VERIFY_API_URL/api/v1/health" > /dev/null 2>&1; then
              echo "the API answered after ${attempt}s"
              curl -fsS "$VERIFY_API_URL/api/v1/health"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null; then
              echo "::error::The API exited before it listened."
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::The API never answered GET /api/v1/health within 60s."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: verify:ops-reads
        run: pnpm --filter @injishi/api verify:ops-reads

      - name: verify:walk-in
        # Nothing seeds a `guest_stays` row: a stay exists only when somebody
        # arrives. This script creates one through POST /ops/stays/walk-in and
        # checks the guest back out again.
        run: pnpm --filter @injishi/api verify:walk-in

      - name: The API log
        if: always()
        run: |
          set +e
          [ -f "$RUNNER_TEMP/api.log" ] && tail -200 "$RUNNER_TEMP/api.log"
          [ -f "$RUNNER_TEMP/api.pid" ] && kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null
          true

  # ── AC-8 ────────────────────────────────────────────────────────────────────
  # A migration can apply cleanly to an EMPTY database and still fail against
  # production's rows: a NOT NULL with no default on a populated table is the
  # standard shape. The job above only ever proves the empty case, so this one
  # replays every migration on top of production's real schema.
  #
  # The schema comes from the GHCR artifact `schema-capture.yml` publishes, not
  # from a per run Actions artifact: a pull request's run cannot read another
  # workflow run's artifacts, and it can pull an image by tag.
  schema-replay:
    name: replay migrations on production's schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: injishi
          POSTGRES_PASSWORD: injishi
          POSTGRES_DB: injishi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U injishi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://injishi:injishi@127.0.0.1:5432/injishi
      SCHEMA_IMAGE: ghcr.io/${{ github.repository_owner }}/injishi-schema:latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the captured production schema
        id: fetch
        run: |
          set -euo pipefail
          if ! docker pull "$SCHEMA_IMAGE" >/dev/null 2>&1; then
            # Until the DOKPLOY cutover there IS no production on the VPS to
            # capture, so there is nothing to replay against. Skipped loudly
            # rather than passed silently, and rather than failing every pull
            # request on the absence of a thing that does not exist yet.
            echo "::warning::No captured schema at $SCHEMA_IMAGE, so AC-8 is NOT being checked on this run. Run schema-capture once production serves from the VPS."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          container="$(docker create "$SCHEMA_IMAGE")"
          docker cp "$container:/schema.sql" "$RUNNER_TEMP/schema.sql"
          docker rm "$container" >/dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"
          wc -l "$RUNNER_TEMP/schema.sql"

      - name: Restore it
        if: steps.fetch.outputs.available == 'true'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/schema.sql"

      - name: Apply every migration on top of it
        if: steps.fetch.outputs.available == 'true'
        run: pnpm --filter @injishi/api db:migrate
