name: backup

# ADR-048 AC-19. Production gets backups, because making it cheaper to change a
# system you cannot restore is the wrong order to do things in.
#
# THE RUN'S OWN SUCCESS IS THE RECORD. `deploy-production.yml` reads the newest
# successful run of this workflow from the Actions API and refuses to deploy
# when it is older than BACKUP_MAX_AGE_HOURS. Nothing writes a marker file: a
# file is written by the thing it vouches for, and can be raced or edited; a
# run's own success cannot.
#
# So a backup that quietly stops working blocks releases. That is the correct
# direction to fail in, and it is also why AC-22 has to notify on a failed run:
# this is on a `schedule`, and a schedule that silently stops firing is exactly
# the failure a blocked deploy would otherwise be the first sign of.
#
# The tool chain is fixed by the ADR so that the backup and the restore agree:
# `pg_dump` in custom format, a tar of the minio-data volume, `age` to encrypt,
# `rclone` to ship. Restore steps: infra/docker/DOKPLOY.md, "Restoring from a
# backup".
#
# Compliance: production holds personal data under Rwanda's Law 058/2021, which
# is why F-S09 exists. A backup is a copy of that same data and carries the same
# constraint, which is why BACKUP_DESTINATION must be in country.

on:
  schedule:
    # 00:15 UTC, before the 01:00 nightly demo rebuild takes the build lock.
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: back production up
    runs-on: [self-hosted, injishi-vps]
    timeout-minutes: 120
    steps:
      - name: Check the settings are present before touching anything
        run: |
          set -euo pipefail
          # These live in the deploy user's environment ON THE VPS, never in a
          # GitHub secret. A stack value that moves into GitHub is a value that
          # can reach production from outside it, which is the thing the self
          # hosted runner exists to avoid.
          missing=""
          for name in BACKUP_DESTINATION BACKUP_ENCRYPTION_RECIPIENT BACKUP_RETENTION_DAYS; do
            if [ -z "$(printenv "$name" || true)" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing on the host:$missing. See ADR-048 'Configuration required'."
            exit 1
          fi
          for tool in pg_dump age rclone tar; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not installed on the VPS."; exit 1; }
          done
          echo "settings and tools present"

      - name: Dump the database and the objects
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          echo "work=$work" >> "$GITHUB_ENV"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "stamp=$stamp" >> "$GITHUB_ENV"

          compose() {
            docker compose -p injishi -f /opt/injishi/src/infra/docker/docker-compose.dokploy.yml \
              --env-file /opt/injishi/.env "$@"
          }

          # Custom format (-Fc), so the restore can use pg_restore and pick what
          # it needs rather than replaying one enormous SQL stream.
          compose exec -T db pg_dump -Fc -U injishi injishi > "$work/injishi-$stamp.dump"

          # The objects, straight off the volume. A database restored without
          # them points at uploads that are not there.
          docker run --rm \
            -v injishi_minio-data:/data:ro \
            -v "$work":/out \
            alpine:3 tar -czf "/out/minio-$stamp.tar.gz" -C /data .

          ls -lh "$work"

      - name: Encrypt
        run: |
          set -euo pipefail
          # age with a recipient (a public key), so this host can WRITE a backup
          # it cannot itself READ. The private key is kept off the VPS, which is
          # what makes a backup useful after the VPS is what went wrong.
          for file in "$work/injishi-$stamp.dump" "$work/minio-$stamp.tar.gz"; do
            age --recipient "$BACKUP_ENCRYPTION_RECIPIENT" --output "$file.age" "$file"
            rm -f "$file"
          done
          ls -lh "$work"

      - name: Ship to the second in country location
        run: |
          set -euo pipefail
          rclone copy "$work" "$BACKUP_DESTINATION/$(date -u +%Y/%m)" --no-traverse --progress

      - name: Confirm what landed
        run: |
          set -euo pipefail
          # A backup job that reports success without checking the far end is a
          # backup job that reports success forever.
          remote="$BACKUP_DESTINATION/$(date -u +%Y/%m)"
          for name in "injishi-$stamp.dump.age" "minio-$stamp.tar.gz.age"; do
            size="$(rclone size "$remote/$name" --json | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')"
            if [ -z "$size" ] || [ "$size" -lt 1024 ]; then
              echo "::error::$name is missing or implausibly small at the destination."
              exit 1
            fi
            echo "$name: $size bytes"
          done

      - name: Prune by retention
        run: |
          set -euo pipefail
          rclone delete "$BACKUP_DESTINATION" --min-age "${BACKUP_RETENTION_DAYS}d" --rmdirs
          echo "pruned copies older than ${BACKUP_RETENTION_DAYS} days"

      - name: Tidy up
        if: always()
        run: rm -rf "$work" || true
