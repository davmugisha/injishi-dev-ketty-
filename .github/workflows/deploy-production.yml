name: deploy-production

# ADR-048 AC-13 to AC-16.
#
# Production changes only when a person decides it should. `workflow_dispatch`
# is the ONLY trigger: no push, no merge and no schedule reaches this file.
# Required reviewers on an environment are an Enterprise only feature for
# private repositories, so a native approval gate is not available; a dispatch
# is plan independent, auditable, and is the same decision that is made by hand
# today.
#
# Two gates stand in front of it, and both are read from the Actions API with
# this workflow's own token rather than from a file on the host. A marker file
# is written by the thing it vouches for, which makes it a record of an
# intention rather than of an event, and it can be raced or edited. A run's own
# success cannot be.
#
#   AC-14  The newest successful `deploy-staging` run must have deployed THIS
#          commit. You promote what staging is running, not what it once ran.
#   AC-15  The newest successful `backup` run must be recent. Automating changes
#          to a system nobody can restore is the wrong order to do things in, so
#          a stalled backup blocks a release. That will occasionally stop you
#          from shipping, and that is the correct direction to fail in.
#
# NOT RUNNABLE UNTIL THE DOKPLOY CUTOVER. DNS still points production at Railway
# and Vercel, so there is nothing on the VPS for this to deploy. It is written,
# reviewable and left untriggered on purpose; its first real run is part of the
# cutover.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to deploy. Must be the one staging is running.
        required: true
        type: string

permissions:
  contents: read
  actions: read # reading the `deploy-staging` and `backup` run history

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs on a GitHub hosted runner: this is an API question, and there is no
  # reason to answer it on the production host.
  gates:
    name: backup and staging gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check both gates
        id: check
        uses: actions/github-script@v7
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          BACKUP_MAX_AGE_HOURS: ${{ vars.BACKUP_MAX_AGE_HOURS || '26' }}
        with:
          script: |
            const requested = process.env.REQUESTED_COMMIT.trim();
            if (!/^[0-9a-f]{7,40}$/.test(requested)) {
              core.setFailed(`'${requested}' is not a git sha.`);
              return;
            }

            const newestSuccessful = async (workflowFile) => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                status: 'success',
                per_page: 1,
              });
              return data.workflow_runs[0] ?? null;
            };

            // ── AC-15, the backup gate ──────────────────────────────────────
            const backup = await newestSuccessful('backup.yml');
            if (!backup) {
              core.setFailed(
                'No successful `backup` run exists. Production is not recoverable, ' +
                  'so it is not something to change automatically. Run `backup` first.',
              );
              return;
            }
            const maxAgeHours = Number(process.env.BACKUP_MAX_AGE_HOURS);
            const ageHours = (Date.now() - new Date(backup.updated_at).getTime()) / 36e5;
            core.info(`Newest successful backup: run ${backup.id}, ${ageHours.toFixed(1)}h old.`);
            if (ageHours > maxAgeHours) {
              core.setFailed(
                `The newest successful backup is ${ageHours.toFixed(1)}h old, and ` +
                  `BACKUP_MAX_AGE_HOURS is ${maxAgeHours}. Refusing before anything changed. ` +
                  `Find out why the backup stopped rather than raising the limit.`,
              );
              return;
            }

            // ── AC-14, the staging gate ─────────────────────────────────────
            const staging = await newestSuccessful('deploy-staging.yml');
            if (!staging) {
              core.setFailed('No successful `deploy-staging` run exists, so no commit has been run anywhere.');
              return;
            }
            core.info(`Newest successful staging deploy: run ${staging.id}, head ${staging.head_sha}.`);
            if (!staging.head_sha.startsWith(requested) && !requested.startsWith(staging.head_sha)) {
              core.setFailed(
                `Staging is running ${staging.head_sha}, not ${requested}. Refusing before anything ` +
                  `changed. Production is promoted from what staging IS running, not from what it ` +
                  `once ran: merge to main, let staging deploy, then dispatch that sha.`,
              );
              return;
            }

            core.info('Both gates pass.');
            core.setOutput('commit', requested);

  deploy:
    name: deploy production
    needs: gates
    runs-on: [self-hosted, injishi-vps]
    timeout-minutes: 120
    steps:
      - name: Deploy, and roll back if it does not come up healthy
        env:
          DEPLOY_HEALTH_TIMEOUT: ${{ vars.DEPLOY_HEALTH_TIMEOUT || '600' }}
          DEPLOY_LOCK_TIMEOUT: ${{ vars.DEPLOY_LOCK_TIMEOUT || '1800' }}
          COMMIT: ${{ needs.gates.outputs.commit }}
        run: |
          set -euo pipefail
          src=/opt/injishi/src
          git -C "$src" fetch --quiet origin
          git -C "$src" checkout --quiet --force "$COMMIT"
          bash "$src/infra/docker/deploy-stack.sh" --stack production --commit "$COMMIT" --rollback

      - name: What is serving now
        if: always()
        run: |
          set +e
          echo "checkout: $(git -C /opt/injishi/src rev-parse HEAD)"
          docker compose -p injishi ps
          docker image ls --filter reference='injishi-*' --filter reference='ghcr.io/*/injishi-api'

      - name: The schema was not rolled back
        if: failure()
        run: |
          echo "::warning::A rollback restores IMAGES ONLY. Any migration this release applied is"
          echo "::warning::still applied, so the restored image is running against a newer schema"
          echo "::warning::than it shipped with. Check the release's migrations before deciding"
          echo "::warning::whether the rollback is actually sufficient."
